@if (toastService.currentToast(); as t) {
  <div
    class="fixed bottom-4 left-3 right-3 sm:left-auto sm:right-6 z-60 flex items-center justify-between gap-3 px-4 py-2.5 rounded-full bg-surface/95 backdrop-blur-xl border border-outline/80 shadow-2xl text-xs font-semibold text-on-surface animate-in slide-in-from-bottom-3 fade-in duration-200 max-w-[calc(100vw-1.5rem)] sm:max-w-md select-none"
    role="status"
    aria-live="polite"
  >
    <div class="flex items-center gap-2.5 min-w-0">
      <!-- Icono de estado -->
      <div
        class="w-5 h-5 rounded-full flex items-center justify-center shrink-0"
        [class.text-emerald-600]="t.tone === 'success'"
        [class.dark:text-emerald-400]="t.tone === 'success'"
        [class.text-primary]="t.tone === 'info'"
        [class.text-amber-500]="t.tone === 'warning'"
        [class.text-rose-600]="t.tone === 'danger'"
      >
        @switch (t.tone) {
          @case ('success') {
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
              <polyline points="22 4 12 14.01 9 11.01" />
            </svg>
          }
          @case ('danger') {
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10" />
              <line x1="15" y1="9" x2="9" y2="15" />
              <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
          }
          @case ('warning') {
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
              <line x1="12" y1="9" x2="12" y2="13" />
              <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
          }
          @default {
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="10" />
              <line x1="12" y1="16" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12.01" y2="8" />
            </svg>
          }
        }
      </div>

      <!-- Texto del mensaje -->
      <span class="truncate leading-tight text-on-surface">{{ t.message }}</span>
    </div>

    <!-- Botón Descartar (SOLO ICONO - REGLA 1) -->
    <button
      type="button"
      (click)="toastService.dismiss()"
      title="Cerrar notificación"
      aria-label="Cerrar notificación"
      class="w-5 h-5 rounded-full flex items-center justify-center text-on-surface-muted hover:text-on-surface hover:bg-surface-muted active:scale-90 transition-all cursor-pointer shrink-0"
    >
      <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>
  </div>
}
