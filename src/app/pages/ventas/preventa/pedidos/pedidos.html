<app-data-grid
  [columns]="columns"
  [data]="pedidos()"
  [actions]="actions"
  newButtonTitle="Crear nuevo pedido"
  searchPlaceholder="Buscar por código, cliente o vendedor..."
  storageKey="ventas-pedidos"
  (onNew)="handleNew()"
  (onAction)="handleAction($event)"
/>

<app-order-editor-modal
  [isOpen]="isEditorOpen()"
  (closed)="isEditorOpen.set(false)"
  (saved)="onOrderSaved($event)"
/>

<app-document-viewer
  [isOpen]="isViewerOpen()"
  [document]="selectedDocument()"
  (closed)="isViewerOpen.set(false)"
/>
