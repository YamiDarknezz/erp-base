<app-data-grid
  [columns]="columns"
  [data]="facturas()"
  [actions]="actions"
  newButtonTitle="Emitir comprobante electrónico"
  searchPlaceholder="Buscar por comprobante, cliente o RUC..."
  storageKey="ventas-facturacion"
  (onNew)="handleNew()"
  (onAction)="handleAction($event)"
/>

<app-order-editor-modal
  [isOpen]="isEditorOpen()"
  (closed)="isEditorOpen.set(false)"
  (saved)="onOrderSaved($event)"
/>

<app-document-viewer
  [isOpen]="isViewerOpen()"
  [document]="selectedDocument()"
  (closed)="isViewerOpen.set(false)"
/>
