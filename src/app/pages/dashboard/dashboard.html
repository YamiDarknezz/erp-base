<div class="min-h-screen bg-surface-alt">
  <!-- Top bar -->
  <header class="h-16 border-b border-outline bg-surface flex items-center justify-between px-6">
    <div class="flex items-center gap-3">
      <svg class="w-8 h-8 text-primary" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="16" height="16" rx="3" fill="currentColor" />
        <rect x="22" y="2" width="16" height="7" rx="2" fill="currentColor" opacity="0.7" />
        <rect x="22" y="13" width="16" height="5" rx="2" fill="currentColor" opacity="0.4" />
        <rect x="2" y="22" width="16" height="5" rx="2" fill="currentColor" opacity="0.4" />
        <rect x="2" y="31" width="7" height="7" rx="2" fill="currentColor" opacity="0.7" />
        <rect x="13" y="31" width="5" height="7" rx="2" fill="currentColor" opacity="0.4" />
        <rect x="22" y="22" width="16" height="16" rx="3" fill="currentColor" opacity="0.6" />
      </svg>
      <span class="text-on-surface font-semibold tracking-tight">Sistema ERP</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Theme toggle -->
      <button
        type="button"
        (click)="theme.toggle()"
        class="p-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-muted transition-colors cursor-pointer"
        [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        @if (theme.isDark()) {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
          </svg>
        } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        }
      </button>

      <!-- Logout -->
      <button
        type="button"
        (click)="logout()"
        class="px-4 py-2 text-sm font-medium text-on-surface-variant hover:text-danger border border-outline rounded-lg hover:border-danger/30 hover:bg-danger-soft transition-all cursor-pointer"
      >
        Cerrar Sesión
      </button>
    </div>
  </header>

  <!-- Content -->
  <main class="p-6">
    <h1 class="text-2xl font-bold text-on-surface">Dashboard</h1>
    <p class="text-on-surface-variant mt-1">Bienvenido al sistema</p>
  </main>
</div>
