<div class="w-full h-full relative flex flex-col justify-between overflow-hidden erp-ambient-bg select-none">

  <!-- Ondas decorativas de fondo -->
  <div class="absolute inset-0 pointer-events-none opacity-40 dark:opacity-30">
    <svg class="w-full h-full object-cover" viewBox="0 0 1440 800" fill="none" preserveAspectRatio="none">
      <path d="M0,320L60,341.3C120,363,240,405,360,394.7C480,384,600,320,720,309.3C840,299,960,341,1080,357.3C1200,373,1320,363,1380,357.3L1440,352L1440,800L1380,800C1320,800,1200,800,1080,800C960,800,840,800,720,800C600,800,480,800,360,800C240,800,120,800,60,800L0,800Z" fill="url(#waveGrad)" />
      <defs>
        <linearGradient id="waveGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
          <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.35" />
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- ── Panel de Alertas Operacionales ── -->
  <div class="relative z-10 p-3 sm:p-5 lg:p-6 max-w-7xl mx-auto w-full">
    
    <!-- Contenedor translúcido de Alertas -->
    <div class="rounded-2xl backdrop-blur-md bg-white/40 dark:bg-slate-900/50 border border-white/60 dark:border-slate-800/80 p-4 lg:p-5 shadow-xl">
      
      <!-- Título Centrado del Panel -->
      <div class="text-center mb-4">
        <h2 class="text-lg sm:text-xl font-bold tracking-tight text-slate-800 dark:text-white drop-shadow-xs">
          Alertas
        </h2>
      </div>

      <!-- Grid de Tarjetas de Alertas -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3.5">
        @for (alert of alerts(); track alert.id) {
          <div
            class="rounded-xl p-3.5 flex flex-col justify-between relative shadow-md transition-all duration-200 hover:-translate-y-0.5 hover:shadow-lg cursor-pointer"
            [class.bg-amber-400]="alert.type === 'warning'"
            [class.text-amber-950]="alert.type === 'warning'"
            [class.bg-rose-600]="alert.type === 'danger'"
            [class.text-white]="alert.type === 'danger'"
          >
            <!-- Icono de información -->
            <div class="absolute top-2 right-2 opacity-70 hover:opacity-100 transition-opacity">
              <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="16" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12.01" y2="8" />
              </svg>
            </div>

            <!-- Métrica Grande + Descripción -->
            <div class="flex items-start gap-3 pr-3">
              <div class="text-xl sm:text-2xl font-black tracking-tight shrink-0 min-w-10">
                {{ alert.badge }}
              </div>
              <p class="text-xs font-medium leading-snug">
                {{ alert.title }}
              </p>
            </div>

            <!-- Icono de estado -->
            <div class="flex justify-end mt-2 opacity-90">
              @if (alert.type === 'danger') {
                <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <circle cx="12" cy="12" r="10" />
                  <line x1="15" y1="9" x2="9" y2="15" />
                  <line x1="9" y1="9" x2="15" y2="15" />
                </svg>
              } @else {
                <svg class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
                  <line x1="12" y1="9" x2="12" y2="13" />
                  <line x1="12" y1="17" x2="12.01" y2="17" />
                </svg>
              }
            </div>
          </div>
        }
      </div>

      <!-- Pie de Alertas: Timestamp + Botón de Actualizar (SOLO ICONO) -->
      <div class="mt-4 pt-2.5 border-t border-slate-300/40 dark:border-slate-800/60 flex items-center justify-center gap-2 text-[11px] font-medium text-slate-700 dark:text-slate-300">
        <span>Actualizado: {{ lastUpdated() }}</span>
        <button
          type="button"
          (click)="refreshAlerts()"
          title="Actualizar alertas operacionales"
          aria-label="Actualizar alertas"
          class="w-6 h-6 rounded-full flex items-center justify-center text-slate-700 dark:text-slate-300 hover:bg-black/10 dark:hover:bg-white/10 transition-colors cursor-pointer"
        >
          <svg
            class="w-3.5 h-3.5"
            [class.animate-spin]="isRefreshing()"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67" />
          </svg>
        </button>
      </div>

    </div>

  </div>

  <!-- ── Sección Inferior: Marca de Agua Genérica ERP BASE ── -->
  <div class="relative z-10 p-5 lg:p-6 flex items-end justify-between select-none pointer-events-none">
    
    <!-- Marca de agua genérica -->
    <div class="flex items-baseline gap-2 text-slate-900/15 dark:text-white/15">
      <span class="text-3xl lg:text-5xl font-black tracking-tighter">ERP BASE</span>
      <span class="text-lg lg:text-2xl font-bold tracking-tight">v{{ appVersion() }}</span>
    </div>

    <!-- Icono de sample de estado -->
    <div class="text-slate-900/10 dark:text-white/10 hidden sm:block">
      <svg class="w-14 h-14 lg:w-16 lg:h-16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="2" y="3" width="20" height="14" rx="2" />
        <line x1="8" y1="21" x2="16" y2="21" />
        <line x1="12" y1="17" x2="12" y2="21" />
      </svg>
    </div>

  </div>

</div>
