# ==============================================================================
# Configuración Nginx de Alto Rendimiento para ERP Base (Angular 21 SPA + PWA)
# ==============================================================================

map $uri $cache_control {
    default                                             "no-cache, no-store, must-revalidate";
    ~*\.(?:js|css)$                                      "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|gif|svg|ico|webp|woff2?|ttf|otf)$    "public, max-age=86400";
    ~*(?:index\.html|app-version\.json|ngsw\.json|manifest\.webmanifest)$ "no-cache, no-store, must-revalidate";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compresión Gzip ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Cabeceras de Seguridad y Control de Caché ─────────────────────────────
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cache-Control $cache_control always;

    # ── Endpoint de Salud (Smoke Test y Docker Healthcheck) ────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # ── SPA Angular Routing ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Páginas de Error ──────────────────────────────────────────────────────
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
